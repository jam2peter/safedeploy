name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python bundle tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: PHP capabilities
        run: |
          php -v
          php -m | grep -E 'openssl|PDO|pdo_sqlite'

      - name: PHP lint
        run: find server tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: OIDC synthetic tests
        run: php tests/test_oidc.php

      - name: Deploy executor synthetic tests
        run: php tests/test_executor.php

      - name: Public sanitization scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.'             --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'             --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE 'JamPeter-Web-Infrastructure|jamagent-private|lab\.jampeter\.com\.br'             --exclude-dir=.git --exclude=ci.yml .
